<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Group Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth" class="auth-container">
    <form class="auth-box" onsubmit="return false;">
        <h2>Login / Register</h2>

        <input id="authUser" placeholder="Username" autocomplete="username">
        <input id="authPass" type="password" placeholder="Password" autocomplete="current-password">

        <div class="auth-buttons">
            <button type="button" onclick="register()">Register</button>
            <button type="button" onclick="login()">Login</button>
        </div>

        <p id="authStatus">Not logged in</p>
    </form>
</div>

<!-- CHAT APP -->
<div id="app" class="chat-container hidden">

<!-- LEFT SIDEBAR -->
<div class="sidebar">

    <!-- APP TITLE -->
    <div class="sidebar-header">
        <h2>Chats</h2>

        <button class="icon-btn" onclick="toggleDmActions()">
            ＋
        </button>
    </div>

    <!-- DM ACTIONS -->
    <div id="dmActions" class="sidebar-actions hidden">

        <input id="dmUserId" placeholder="Enter User ID">

        <button onclick="startDM()">
            Start Chat
        </button>

    </div>

    <!-- DM LIST -->
    <div class="sidebar-section">

        <div class="section-title">
            Direct Messages
        </div>

        <div id="chatList" class="chat-list">
            <!-- DM users here -->
        </div>

    </div>

    <!-- GROUPS -->
    <div class="sidebar-section">

        <div class="section-header">

            <div class="section-title">
                Groups
            </div>

            <button class="small-btn" onclick="toggleGroupActions()">
                +
            </button>

        </div>

        <div id="groupList" class="chat-list">
            <!-- Groups here -->
        </div>

        <!-- GROUP ACTIONS -->
        <div id="groupActions" class="sidebar-actions hidden">

            <input id="groupName" placeholder="New group name">

            <button onclick="createGroup()">
                Create Group
            </button>

            <input id="joinGroupId" placeholder="Enter Group ID">

            <button onclick="joinGroup()">
                Join Group
            </button>

        </div>

    </div>

</div>

    <!-- MAIN CHAT -->
    <div class="main">

    <!-- ✅ CHAT HEADER (ADD THIS) -->
<div class="chat-header">
    <div class="chat-title" id="groupTitle">Select a group</div>

    <div class="header-actions">
        <button class="users-toggle" onclick="toggleUsersPanel()">
            ☰ Users
        </button>

        <button id="leaveBtn" onclick="leaveGroup()" style="display:none;">
            Leave
        </button>
    </div>
</div>
    <div id="messages"></div>
    <div id="typing" class="typing hidden"></div>

    <div class="bottom">
        <input id="messageInput" disabled>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

</div>

    <!-- RIGHT PANEL -->
    <div class="rightbar">

        <button onclick="toggleUsersPanel()">Users</button>

        <div id="usersPanel" class="hidden">

            <h4>All Members</h4>
            <div id="allUsers"></div>

        </div>

    </div>

</div>

<script>
    let currentGroup = null;
let ws = null;
let currentUser = null;
let groups = [];
let dms = [];
let currentChatName = "";

const messages = document.getElementById("messages");
const typingDiv = document.getElementById("typing");
const onlineUsersDiv = document.getElementById("onlineUsers");
const allUsersDiv = document.getElementById("allUsers");

function setChatEnabled(state) {
    document.getElementById("messageInput").disabled = !state;
    document.getElementById("sendBtn").disabled = !state;
}

// ---------------- PERSIST LOGIN ----------------
function initAuthState() {
    const token = localStorage.getItem("access");
    const user = localStorage.getItem("user");
    // console.log(token,user)
    if (token && user) {
        currentUser = user;
        updateHeader();
        showChat();
        loadDMs();
        loadGroups();   
    }

    const params = new URLSearchParams(window.location.search);

const conversationId = params.get("conversation");

if (conversationId) {

    currentGroup = conversationId;

    connectWS(conversationId);
}
}

function showChat() {
    document.getElementById("auth").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    setChatEnabled(true);
}

function logout() {
    localStorage.clear();
    location.reload();
}

// ---------------- AUTH ----------------

async function register() {
    const username = document.getElementById("authUser").value;
    const password = document.getElementById("authPass").value;

    const res = await fetch("/auth/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    const data = await res.json();
    document.getElementById("authStatus").innerText =
        data.message || "Registered";
}

async function login() {
    const username = document.getElementById("authUser").value;
    const password = document.getElementById("authPass").value;

    const formData = new URLSearchParams();
    formData.append("username", username);
    formData.append("password", password);

    const res = await fetch("/auth/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData
    });

    const data = await res.json();

    if (!data.access_token) {
        document.getElementById("authStatus").innerText = "Login failed";
        return;
    }

    localStorage.setItem("access", data.access_token);
    localStorage.setItem("refresh", data.refresh_token);
    localStorage.setItem("user", username);

    currentUser = username;

    showChat();
}

// ---------------- WS ----------------

async function startDM() {

    const token = localStorage.getItem("access");

    const userId = document
        .getElementById("dmUserId")
        .value
        .trim();

    if (!userId) {
        return alert("Enter user id");
    }

    const res = await fetch("/chat/dm", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
            user_ids: [Number(userId)]
        })
    });

    const data = await res.json();

    if (!res.ok) {
        return alert(data.detail || "Failed");
    }

    await loadDMs();

    connectWS(data.conversation_id);
}

function updateHeader() {

    const title = document.getElementById("groupTitle");
    const leaveBtn = document.getElementById("leaveBtn");

    if (!currentGroup) {
        title.innerText = "Select a chat";
        leaveBtn.style.display = "none";
        return;
    }

    title.innerText = currentChatName;

    leaveBtn.style.display = "inline-block";
}
async function loadDMs() {

    const token = localStorage.getItem("access");

    const res = await fetch("/chat/dms", {
        headers: {
            "Authorization": `Bearer ${token}`
        }
    });

    dms = await res.json();

    renderDMs();
}

async function loadGroups() {

    const token = localStorage.getItem("access");

    const res = await fetch("/chat/groups", {
        headers: {
            "Authorization": `Bearer ${token}`
        }
    });



    groups = await res.json();

    renderGroups();
}

function renderDMs() {

    const el = document.getElementById("chatList");

    el.innerHTML = "";

    dms.forEach(dm => {

        const div = document.createElement("div");

        div.className = "group";

        div.innerText = dm.username;

        div.onclick = () => {
            currentChatName = dm.username;
            connectWS(dm.conversation_id);
        };

        el.appendChild(div);
    });
}

function renderGroups() {

    const el = document.getElementById("groupList");
    el.innerHTML = "";

    groups.forEach(g => {

        const div = document.createElement("div");
        div.className = "group";

        div.innerText = g.name;

        div.onclick = () => {
            currentChatName = g.name;
            connectWS(g.id);
        };

        el.appendChild(div);
    });
}

function toggleGroupActions() {

    document
        .getElementById("groupActions")
        .classList
        .toggle("hidden");
}

function toggleUsersPanel() {

    document
        .getElementById("usersPanel")
        .classList
        .toggle("hidden");
}

async function loadUsers(conversation_id) {
    const res = await fetch(`/chat/conversations/${conversation_id}/users`, {
        headers: {
            "Authorization": `Bearer ${localStorage.getItem("access")}`
        }
    });

    const data = await res.json();
    renderUsers(data);
}

async function leaveGroup() {

    if (!currentGroup) {
        return;
    }

    const token = localStorage.getItem("access");

    const res = await fetch(
        `/chat/groups/${currentGroup}/leave`,
        {
            method: "DELETE",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        }
    );

    const data = await res.json();

    if (!res.ok) {
        return alert(data.detail || "Failed");
    }

    if (ws) {
        ws.close();
    }

    currentGroup = null;
    updateHeader();
    messages.innerHTML = "";

    alert("Left group");
}

async function createGroup() {

    const token = localStorage.getItem("access");

    const name = document
        .getElementById("groupName")
        .value
        .trim();

    if (!name) {
        return alert("Enter group name");
    }

    const res = await fetch("/chat/groups", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
            name,
            participants: []
        })
    });

    const data = await res.json();

    if (!res.ok) {
        return alert(data.detail || "Failed");
    }

    currentGroup = data.group_id;
updateHeader();
    connectWS(currentGroup);
}

async function joinGroup() {

    const token = localStorage.getItem("access");

    const groupId = document
        .getElementById("joinGroupId")
        .value
        .trim();

    if (!groupId) {
        return alert("Enter group id");
    }

    const res = await fetch("/chat/groups/join", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
            conversation_id: Number(groupId)
        })
    });

    const data = await res.json();

    if (!res.ok) {
        return alert(data.detail || "Join failed");
    }

    currentGroup = groupId;

    connectWS(currentGroup);
}

function connectWS(conversation_id) {
    if (ws) {
        ws.close();
    }
    currentGroup = conversation_id;   // ✅ IMPORTANT FIX
    updateHeader();

    const token = localStorage.getItem("access");

    if (!token) return alert("Login first");

    const protocol = location.protocol === "https:" ? "wss" : "ws";

    ws = new WebSocket(
        `${protocol}://${location.host}/ws/${conversation_id}?token=${token}`
    );

    ws.onopen = () => {
        setChatEnabled(true);
        loadMessages(conversation_id);
        loadUsers(conversation_id); // ✅ also load users here
    };

    ws.onmessage = (event) => {
        handleMessage(JSON.parse(event.data));
    };

    history.replaceState(null, "", `/?conversation=${conversation_id}`);

    ws.onclose = () => {
        setChatEnabled(false);
    };
}
// ---------------- CHAT ----------------

function sendMessage() {
    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!ws || !text) return;

    ws.send(JSON.stringify({
        type: "chat",
        message: text
    }));

    input.value = "";
}

// ---------------- UI ----------------

function toggleDmActions() {
    document
        .getElementById("dmActions")
        .classList
        .toggle("hidden");
}

async function loadMessages(conversation_id) {

    const token = localStorage.getItem("access");

    const res = await fetch(
        `/chat/conversations/${conversation_id}/messages`,
        {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        }
    );

    const data = await res.json();

    messages.innerHTML = "";

    data.forEach(msg => {
        handleMessage(msg);
    });
}

function renderUsers(data) {
    onlineUsersDiv.innerHTML = "";
    allUsersDiv.innerHTML = "";

    data.online.forEach(u => {
        const div = document.createElement("div");
        div.className = "online";
        div.innerText = "🟢 " + u.username;
        onlineUsersDiv.appendChild(div);
    });

    data.all.forEach(u => {
        const div = document.createElement("div");
        div.className = "all";
        div.innerText = "⚪ " + u.username;
        allUsersDiv.appendChild(div);
    });
}

function handleMessage(data) {

    // Handle system messages separately
    console.log("TYPE:",data)
    if (data.type === "system") {
        console.log("Inside SYSTEM")

        const wrapper = document.createElement("div");

        wrapper.className = "msg system";

        wrapper.innerHTML = `
            <div class="meta">system • ${data.time || ""}</div>
            <div>${data.message}</div>
        `;

        messages.appendChild(wrapper);
        messages.scrollTop = messages.scrollHeight;
    }

    // Handle normal chat messages
    else if (data.type === "chat") {

        const wrapper = document.createElement("div");

        const isSelf = data.user === currentUser;

        wrapper.className = `msg ${isSelf ? "self" : ""}`;

        wrapper.innerHTML = `
            <div class="meta">${data.user} • ${data.time || ""}</div>
            <div>${data.message}</div>
        `;

        messages.appendChild(wrapper);
        messages.scrollTop = messages.scrollHeight;
    }

    // Typing indicator
    if (data.type === "typing") {
    if (data.user === currentUser) return;

    typingDiv.classList.remove("hidden");

    typingDiv.innerHTML = `
        <div class="typing-text">${data.user} is typing</div>
        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    clearTimeout(window.typingTimeout);

    window.typingTimeout = setTimeout(() => {
        typingDiv.classList.add("hidden");
    }, 1200);
}

    // Online users
    if (data.type === "online_users") {

        onlineUsersDiv.innerHTML = "";

        data.users.forEach(u => {
            const div = document.createElement("div");

            div.className = "user";
            div.innerText = u.username;

            onlineUsersDiv.appendChild(div);
        });
    }
}

// ENTER KEY
document.getElementById("messageInput")
.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
});

// TYPING
let isTyping = false;

document.getElementById("messageInput")
.addEventListener("input", () => {
    if (!ws || isTyping) return;

    isTyping = true;

    ws.send(JSON.stringify({ type: "typing" }));

    setTimeout(() => isTyping = false, 1000);
});

// INIT
initAuthState();
</script>

</body>
</html>
